name: Deploy DocuMind to AWS (Hybrid Cloud)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Deploy to EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # Enable GatewayPorts in SSH so the reverse tunnel can bind to 0.0.0.0
          sudo sed -i 's/#GatewayPorts no/GatewayPorts yes/g' /etc/ssh/sshd_config
          sudo systemctl restart sshd

          if [ ! -d "DocuMind" ]; then
            git clone https://github.com/AdityaKishore0698/DocuMind.git
            cd DocuMind
          else
            cd DocuMind
            git pull origin main
          fi
          
          # Install Docker if not present
          if ! command -v docker &> /dev/null; then
            curl -fsSL https://get.docker.com -o get-docker.sh
            sudo sh get-docker.sh
          fi
          
          # Spin up ONLY the web/API containers using the production compose file
          sudo docker compose -f docker-compose.prod.yml up -d --build
